<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Wheel</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial;color:#111827}.app{max-width:700px;margin:auto;padding:18px 14px 40px}h1{text-align:center}.wheel{position:relative;width:min(92vw,520px);aspect-ratio:1;margin:auto}canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 8px 28px #0002;background:#fff}.pointer{position:absolute;z-index:2;left:50%;top:-2px;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #111827}#spin{display:block;width:min(92%,360px);margin:18px auto;padding:15px;border:0;border-radius:12px;background:#111827;color:white;font-size:22px;font-weight:bold}#spin:disabled{opacity:.5}.result,.panel{background:white;border-radius:12px;padding:15px;box-shadow:0 3px 12px #0001;margin-bottom:16px}.result{text-align:center}.label{font-size:12px;color:#6b7280}.winner{font-size:25px;font-weight:bold}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}.row button,.controls button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold}.add{background:#2563eb;color:white}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{background:#e5e7eb}.danger{background:#fee2e2!important;color:#991b1b}.options{list-style:none;padding:0}.options li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}.remove{border:0;background:none;color:#dc2626;font-size:18px}.empty{text-align:center;color:#6b7280}
</style></head><body><div class="app"><h1>Food Wheel</h1><div class="wheel"><div class="pointer"></div><canvas id="wheel"></canvas></div><button id="spin">SPIN</button><div class="result"><div class="label">RESULT</div><div id="winner" class="winner">—</div></div><div class="panel"><h2>Food Options</h2><div class="row"><input id="input" placeholder="Enter a food..."><button class="add" id="add">Add</button></div><ul class="options" id="list"></ul><div class="controls"><button id="clear">Clear All</button><button id="reset">Reset Defaults</button><button class="danger" id="removeWinner">Remove Winner</button></div></div></div>
<script>
const defaults=["Chicken Rice","Nasi Lemak","McDonald's","Pizza","Mala","Ramen","KFC","Burger","Sushi","Korean Food"];let options=JSON.parse(localStorage.getItem("foodWheelOptions")||"null")||defaults.slice(),rotation=0,spinning=false,lastWinner=null;
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),spin=document.getElementById("spin"),winner=document.getElementById("winner"),input=document.getElementById("input"),list=document.getElementById("list");
function save(){localStorage.setItem("foodWheelOptions",JSON.stringify(options))}
function draw(){let d=devicePixelRatio||1,s=Math.max(100,canvas.clientWidth),c=s/2,r=c-7;canvas.width=s*d;canvas.height=s*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,s,s);if(!options.length){ctx.fillStyle="#e5e7eb";ctx.beginPath();ctx.arc(c,c,r,0,7);ctx.fill();ctx.fillStyle="#6b7280";ctx.font="bold 22px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("Add food options",c,c);return}let sl=2*Math.PI/options.length;options.forEach((x,i)=>{let a=rotation+i*sl-Math.PI/2;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+sl);ctx.closePath();ctx.fillStyle=`hsl(${i*360/options.length},75%,62%)`;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(a+sl/2);ctx.fillStyle="#111827";ctx.font=`bold ${Math.max(11,Math.min(22,300/options.length))}px Arial`;ctx.textAlign="right";ctx.textBaseline="middle";let t=x,max=Math.max(7,Math.floor(30/Math.max(1,options.length/8)));if(t.length>max)t=t.slice(0,max-1)+"…";ctx.fillText(t,r-18,0);ctx.restore()});ctx.beginPath();ctx.arc(c,c,Math.min(46,c*.13),0,2*Math.PI);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#d1d5db";ctx.stroke()}
function render(){list.innerHTML="";spin.disabled=!options.length;if(!options.length){list.innerHTML='<li class="empty">No food options.</li>';draw();return}options.forEach((x,i)=>{let li=document.createElement("li"),s=document.createElement("span"),b=document.createElement("button");s.textContent=x;b.textContent="×";b.className="remove";b.onclick=()=>{if(!spinning){options.splice(i,1);save();render()}};li.append(s,b);list.append(li)});draw()}
document.getElementById("add").onclick=()=>{let x=input.value.trim();if(x){options.push(x);input.value="";save();render();input.focus()}};input.onkeydown=e=>{if(e.key==="Enter")document.getElementById("add").click()};document.getElementById("clear").onclick=()=>{if(!spinning){options=[];lastWinner=null;winner.textContent="—";save();render()}};document.getElementById("reset").onclick=()=>{if(!spinning){options=defaults.slice();lastWinner=null;winner.textContent="—";save();render()}};document.getElementById("removeWinner").onclick=()=>{if(!spinning&&lastWinner){let i=options.indexOf(lastWinner);if(i>=0)options.splice(i,1);lastWinner=null;save();render()}};
spin.onclick=()=>{if(spinning||!options.length)return;spinning=true;spin.disabled=true;winner.textContent="Spinning...";let wi=Math.floor(Math.random()*options.length),sl=2*Math.PI/options.length,cur=((rotation%(2*Math.PI))+2*Math.PI)%(2*Math.PI),target=1.5*Math.PI-(wi+.5)*sl,delta=((target-cur)%(2*Math.PI)+2*Math.PI)%(2*Math.PI),start=rotation,end=rotation+(6+Math.floor(Math.random()*3))*2*Math.PI+delta,t0=performance.now(),dur=4000;function f(now){let p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);rotation=start+(end-start)*e;draw();if(p<1)requestAnimationFrame(f);else{rotation=end;lastWinner=options[wi];winner.textContent=lastWinner;spinning=false;spin.disabled=false;draw()}}requestAnimationFrame(f)};window.onresize=draw;render();
</script></body></html>
